[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ch-phase-separation"
version = "0.1.0"
description = "Two-dimensional Cahn-Hilliard phase separation on a periodic grid"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["numpy>=1.26,<3", "matplotlib>=3.8,<4"]

[project.scripts]
phase-separation = "phase_separation:main"

[tool.setuptools]
py-modules = ["phase_separation"]
